# DevSuite lint config (BACKLOG DX-1). Run: ruff check .   (pre-commit runs it on staged files)
line-length = 120
target-version = "py311"
extend-exclude = ["static", ".venv", "specs", "scripts/versions.json"]

[lint]
select = ["E", "F", "W", "B006", "B008", "S102", "S307"]   # errors, pyflakes, warnings, mutable defaults, exec/eval
ignore = [
    "E501",   # long lines are tracked by SonarCloud; formatting is not enforced here
    "B008",   # FastAPI idiom: File(...)/Depends() in argument defaults
]

[lint.per-file-ignores]
"main.py" = ["F401"]            # re-exports kept for test compatibility (documented in main.py)
"tests/**" = ["F401", "E402", "S102", "S307"]
"scripts/check_updates.py" = ["W293"]   # blank lines inside embedded text
