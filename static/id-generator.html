<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Generator — DevSuite</title>
    <meta name="description" content="Bulk-generate UUID v4/v7, ULID, CUID2, and NanoID identifiers with entropy inspection. 100% local, no cloud.">
    <link rel="stylesheet" href="/static/libs/fonts.css">
    <link rel="stylesheet" href="/static/linter.css">
    <link rel="stylesheet" href="/static/id-generator.css">
    <script src="/static/theme.js?v=2"></script>
</head>
<body>

<div id="toast-container"></div>

<!-- HEADER -->
<header class="tool-header" aria-label="ID Generator toolbar">
    <div class="header-left">
        <a href="/tools" class="back-link" aria-label="Back to DevSuite tools">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            DevSuite
        </a>
        <div class="tool-identity">
            <div class="tool-icon tool-icon-indigo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                    <line x1="7" y1="9" x2="7" y2="15"/>
                    <line x1="11" y1="9" x2="11" y2="15"/>
                    <line x1="15" y1="12" x2="17" y2="12"/>
                </svg>
            </div>
            <span class="tool-name">ID <span class="tool-accent">Generator</span></span>
            <span class="tool-version">v1.0</span>
        </div>
    </div>
    <div class="header-right">
        <output id="idg-status" class="status-pill idle" aria-live="polite" aria-atomic="true"><span class="status-dot" aria-hidden="true"></span><span id="idg-status-text">Ready</span></output>
    </div>
</header>

<main class="idg-main">

    <!-- Control column -->
    <section class="idg-controls" aria-label="Generator controls">

        <div class="idg-panel">
            <h2 id="idg-type-label">Identifier Type</h2>
            <div class="idg-types" role="group" aria-labelledby="idg-type-label" id="idg-types">
                <!-- buttons injected by id-generator.js -->
            </div>
        </div>

        <div class="idg-panel">
            <h2>Batch</h2>
            <div class="idg-count-row">
                <label for="idg-count">Count</label>
                <input id="idg-count" class="idg-count-input" type="number" min="1" max="1000" value="10" inputmode="numeric" aria-describedby="idg-count-error">
            </div>
            <div id="idg-count-error" class="idg-input-error" role="alert" aria-live="assertive"></div>
            <button id="idg-generate" class="btn btn-primary idg-generate" aria-label="Generate identifiers">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 8-8V2.5L16 5l-4 2.5V6a6 6 0 1 0 6 6h2a8 8 0 1 1-16 0z"/></svg>
                Generate
            </button>
        </div>

        <div class="idg-panel">
            <h2>Entropy &amp; Structure</h2>
            <p id="idg-entropy-blurb" class="idg-entropy-blurb"></p>
            <div class="idg-facts" id="idg-facts"></div>
            <div id="idg-sortable" class="idg-sortable-badge" hidden>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                Time-sortable
            </div>
        </div>

    </section>

    <!-- Results column -->
    <section class="idg-results" aria-label="Generated identifiers">
        <div class="idg-results-header">
            <span class="idg-results-title" id="idg-results-title">No identifiers yet</span>
            <button id="idg-copy-all" class="btn btn-ghost" style="padding:3px 10px;font-size:0.72rem;" disabled aria-label="Copy all identifiers">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy all
            </button>
        </div>
        <div class="idg-results-list" id="idg-results-list" aria-live="polite">
            <div class="idg-empty" id="idg-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="7" y2="15"/><line x1="11" y1="9" x2="11" y2="15"/><line x1="15" y1="12" x2="17" y2="12"/></svg>
                <span>Pick a type and click Generate to create identifiers.</span>
            </div>
        </div>
    </section>

</main>

<script src="/static/crypto-js.min.js"></script>
<script src="/static/id-gen.js" defer></script>
<script src="/static/id-generator.js" defer></script>
</body>
</html>
