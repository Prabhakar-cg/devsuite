name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==26.2.1
          pip install --require-hashes --only-binary :all: -r requirements-lock.txt
          # httpx / httpx2: test-only deps of starlette's TestClient (httpx2 for starlette >= 1.3)
          pip install --only-binary :all: pytest==9.1.1 httpx==0.28.1 httpx2==2.10.0

      - name: Run backend test suite
        run: pytest tests/python/ -q
